name: Base de datos

on:
  # push en cualquier rama: el resultado queda como check del PR y se prueba antes de abrirlo.
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

# Acciones fijadas por SHA de commit y CLI por versión exacta: este flujo usa
# credenciales de la base remota. Dependabot propone las actualizaciones.
jobs:
  pgtap:
    name: pruebas pgTAP (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - name: Levantar Supabase local (Docker del runner)
        run: supabase start
      - name: Pruebas pgTAP
        run: supabase test db
      - name: Apagar
        if: always()
        run: supabase stop --no-backup

  migrar:
    name: aplicar migraciones al proyecto remoto
    needs: pgtap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      # Conexión directa a la base por su URL (pooler en modo sesión, IPv4): no hay token de la
      # API de Supabase en GitHub ni se usa `supabase link`. El único secreto es SUPABASE_DB_URL.
      - name: Verificar secreto
        id: secreto
        env:
          U: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Falla en rojo: un verde sin migrar dejaría la base desactualizada sin que nadie lo note.
          if [ -z "$U" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL; las migraciones NO se aplicaron."
            exit 1
          fi
          echo "listo=true" >> "$GITHUB_OUTPUT"
      - name: Ver qué migraciones se aplicarían
        if: steps.secreto.outputs.listo == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Aplicar migraciones
        if: steps.secreto.outputs.listo == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
