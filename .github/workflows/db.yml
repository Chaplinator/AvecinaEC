name: Base de datos

on:
  # push en cualquier rama: el resultado queda como check del PR y se prueba antes de abrirlo.
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pgtap:
    name: pruebas pgTAP (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local (Docker del runner)
        run: supabase start
      - name: Pruebas pgTAP
        run: supabase test db
      - name: Apagar
        if: always()
        run: supabase stop --no-backup

  migrar:
    name: aplicar migraciones al proyecto remoto
    needs: pgtap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verificar secretos
        id: secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan secretos de Supabase en GitHub; no se aplican migraciones."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Vincular proyecto
        if: steps.secretos.outputs.listo == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: steps.secretos.outputs.listo == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
