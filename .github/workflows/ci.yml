name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitarios
        run: npm test
      - name: Build
        run: npm run build
      - name: Sin source maps públicos
        run: |
          if find .next/static -name "*.map" | grep -q .; then
            echo "Se encontraron .map en el output público" && exit 1
          fi
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Pendientes (se agregan cuando exista el insumo): pgTAP (con el esquema),
# presupuesto de bundle (con el mapa) y e2e Playwright (con el preview de Vercel).
